[package]
name = "steamvr-video-player"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
anyhow = "1.0"
egui = "0.33.3"
egui_glow = { version = "0.33.3", features = ["winit"] }
env_logger = "0.11"
glam = "0.30"
glow = "0.16"
glutin = { version = "0.32.3", default-features = false, features = ["wgl"] }
libloading = "0.8"
log = "0.4"
openxr = "0.22"
raw-window-handle = "0.6"
rfd = { version = "0.17", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
serde_json = "1.0"
